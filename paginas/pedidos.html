 <fieldset>
    <legend>Datos del cliente</legend>
    <p><label for="nombre">Nombre:</label>
        <input type="text" id="nombre" name="nombre" required="required" /></p>

        <fieldset>

            <p><label for="tipo">Tipo de artesanía:</label>

                <select id="tipo" name="tipo">

                    <option value="mola">Mola</option>
                    <option value="cutarra">Cutarra</option>
                    <option value="tembleque">Tembleque</option>
                    <option value="otra">Otra</option>

                </select></p>

                <p>Ocasión:<br />

                    <input type="radio" id="ocasion-regalo" name="ocasion" value="regalo" checked="checked" />

                    <input type="radio" id="ocasion-cumple" name="ocasion" value="cumpleanos" />
                    <label for="ocasion-cumple">Cumpleaños</label>
                    <input type="radio" id="ocasion-evento" name="ocasion" value="evento" />
                    <label for="ocasion-evento">Evento especial</label></p>

                    <p><label for="mensaje">Mensaje:</label><br />
                        <textarea id="mensaje" name="mensaje" rows="4" cols="30" required="required"></textarea></p>
                        <p><input type="checkbox" id="acepto" name="acepto" value="si" />
                            <label for="acepto">Acepto que me contacten para confirmar el pedido</label></p>

         </fieldset>
         
         <p><input type="submit" value="Enviar" />
